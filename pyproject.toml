[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "focus-python"
version = "0.0.0"
description = "Python helpers for FOCUS"
requires-python = ">=3.8"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["pyfocus.camps*"]
namespaces = true

[tool.setuptools.package-data]
"pyfocus.camps" = ["file/*.npz", "requirements.txt"]
